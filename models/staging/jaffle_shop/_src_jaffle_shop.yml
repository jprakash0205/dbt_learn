version: 2

sources:
  - name: jaffle_shop
    description: A clone of a Postgres database
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
              
      - name: orders
        config: 
          loaded_at_field: _etl_loaded_at
          freshness: 
            warn_after: 
              count: 100
              period: hour
            error_after: 
              count: 7
              period: day
            
            